[build-system]
requires = ["setuptools==75.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "releaseguard-ai-explanation"
version = "0.1.0"
description = "Independent V1 release-risk explanation boundary for ReleaseGuard."
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.115.0",
    "httpx==0.27.2",
    "pydantic==2.8.2",
    "uvicorn==0.30.6",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.setuptools.packages.find]
include = ["releaseguard_ai*"]
